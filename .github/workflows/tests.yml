name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Fast suite (theory, short validation, conservation, sensitivity)
        run: pytest -m "not slow" -q
      - name: Full Erlang C validation gate (30 replications x 4 load points)
        run: pytest -m slow -q
